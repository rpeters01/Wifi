<!DOCTYPE html>
<html>
<head>
  <title>Ron's WiFi</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background-image: url('terminator.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(0,0,0,0.55);
      min-height: 100vh;
      padding: 30px;
    }

    .box {
      background: rgba(20,20,20,0.55);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      backdrop-filter: blur(6px);
    }

    h1 {
      color: #ff3b3b;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255,0,0,0.6);
    }

    .wifi {
      font-size: 26px;
      margin-top: 20px;
    }

    .password {
      font-size: 24px;
      color: #00ff99;
      margin-bottom: 30px;
      margin-top: 20px;
    }

    img {
      width: 250px;
      margin-top: 25px;
      border-radius: 15px;
      border: 5px solid white;
    }

    .small {
      color: #ccc;
      margin-top: 25px;
      font-size: 18px;
    }

  </style>
</head>

<body>

<div class="overlay">

<div class="box">

  <h1>RON'S WIFI</h1>

  <div class="wifi">
    Network:<br>
    ASUS_D0_5G_Guest2
  </div>

  <div class="password">
    Password:<br>
    GuestNetwork2
  </div>

  <p>iPhone users:</p>
  <p>Use the network name and password above.</p>

  <p>Android users:</p>
  <p>Scan the QR code or tap the NFC tag.</p>

  <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=WIFI:T:WPA;S:ASUS_D0_5G_Guest2;P:GuestNetwork2;;">

  <div class="small">
    Guest WiFi access
  </div>

</div>

</div>

</body>
</html>
