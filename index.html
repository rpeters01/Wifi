<!DOCTYPE html>
<html>
<head>
  <title>Ron's WiFi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: #222;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #4fd1ff;
    }

    .wifi {
      font-size: 24px;
      margin-top: 20px;
    }

    .password {
      font-size: 20px;
      color: #00ff99;
      margin-bottom: 30px;
    }

    img {
      width: 250px;
      margin-top: 20px;
      border-radius: 10px;
    }

    .small {
      color: #999;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Welcome to Ron's WiFi</h1>

  <div class="wifi">
    Network:<br>
    ASUS_D0_5G_Guest2
  </div>

  <div class="password">
    Password:<br>
    GuestNetwork2
  </div>

  <p>iPhone users:</p>
  <p>Use the network name and password above.</p>

  <p>Android users:</p>
  <p>Scan the QR code or tap the NFC tag.</p>

  <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=WIFI:T:WPA;S:ASUS_D0_5G_Guest2;P:GuestNetwork2;;">

  <div class="small">
    Guest WiFi access
  </div>
</div>

</body>
</html>
